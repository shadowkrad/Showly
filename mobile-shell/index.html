<!DOCTYPE html>
<html lang="it">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Showly • Taaaac Suite</title>
    <style>
      body {
        margin: 0;
        padding: 0;
        background-color: #0b0b0b;
        color: #f7eed9;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        height: 100vh;
        text-align: center;
      }
      .logo {
        width: 72px;
        height: 72px;
        margin-bottom: 1.5rem;
      }
      .spinner {
        width: 32px;
        height: 32px;
        border: 2px solid rgba(212, 175, 55, 0.2);
        border-top-color: #d4af37;
        border-radius: 50%;
        animation: spin 0.8s linear infinite;
        margin-bottom: 1rem;
      }
      @keyframes spin {
        to { transform: rotate(360deg); }
      }
      h1 {
        font-size: 1.25rem;
        letter-spacing: 0.15em;
        text-transform: uppercase;
        margin: 0 0 0.5rem 0;
      }
      p {
        font-size: 0.8rem;
        color: #9e9e9e;
        margin: 0;
      }
    </style>
  </head>
  <body>
    <div class="spinner"></div>
    <h1>Showly</h1>
    <p>Connessione sicura in corso...</p>
    <script>
      // Se configurato un server remoto o offline fallback
      if (window.location.search.includes('reload')) {
        // stay
      }
    </script>
  </body>
</html>
